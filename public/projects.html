<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Library</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; }
        #container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 40px 20px; }
        .zone-item { cursor: pointer; transition: transform 0.2s; }
        .zone-item:hover { transform: scale(1.05); }
        img { width: 150px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="container">
        <h1 style="text-align: center; margin-top: 20vh;">Loading Games...</h1>
    </div>

    <!-- The Viewer (Required for script.js) -->
    <div id="zoneViewer" style="display: none; position: fixed; inset: 0; background: black; z-index: 9999;">
        <div style="padding: 10px; background: #222;">
            <span id="zoneName"></span>
            <button onclick="closeZone()">Close</button>
        </div>
        <div id="zoneViewerContent"></div>
    </div>

    <script>
        // This is the AdBlock check you had - kept exactly as is
        async function checkAdBlock() {
            try {
                const response = await fetch(new Request("https://pagead2.googlesyndication.com"));
                console.log("AdBlock Enabled: false");
                return false;
            } catch (e) {
                console.log("AdBlock Enabled: true");
                return true;
            }
        }
        checkAdBlock();
    </script>

    <script src="./script.js"></script>
</body>
</html>
