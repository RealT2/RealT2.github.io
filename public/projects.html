<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Library</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        #container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
        }
        .loading-text {
            margin-top: 20vh;
            font-size: 1.5rem;
            opacity: 0.7;
        }
        /* Style for the game items created by script.js */
        .zone-item {
            transition: transform 0.2s;
            max-width: 160px;
        }
        .zone-item:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Main title bar -->
    <div style="padding: 20px; border-bottom: 1px solid #333; text-align: center;">
        <h1 style="margin: 0; font-size: 1.8rem;">Tier 2 Games</h1>
    </div>

    <!-- The Box where script.js will put the games -->
    <div id="container">
        <div class="loading-text">Loading Games Library...</div>
    </div>

    <!-- IMPORTANT: Only call script.js once at the very bottom -->
    <script src="./script.js"></script>

</body>
</html>
