<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Library</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body style="background-color: black; color: white; margin: 0; padding: 0;">

    <!-- This MUST be named "container" (no "game-") -->
    <div id="container">
        <h1 style="text-align: center; margin-top: 20%; font-family: sans-serif;">
            Loading Games...
        </h1>
    </div>

    <!-- The script also needs these hidden "boxes" or it will crash -->
    <div style="display: none;">
        <input type="text" id="searchBar">
        <select id="sortOptions">
            <option value="popular">Popular</option>
        </select>
        <div id="zoneViewer">
            <div id="zoneName"></div>
            <div id="zoneId"></div>
        </div>
    </div>

    <!-- IMPORTANT: Script at the bottom -->
    <script src="./script.js"></script>

</body>
</html>
